<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Qupinator — Авторизация и регистрация</title>
	<!-- Подключение Bootstrap Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="shortcut icon" href="favicon.png" type="image/x-icon">

	<style>
:root {
		--pure-black: #000000;
		--almost-black: #0a0a0a;
		--dark-surface: #141414;
		--elevated: #1c1c1c;
		--border-subtle: #2a2a2a;
		--border-active: #555555;
		--text-primary: #ffffff;
		--text-secondary: #888888;
		--text-tertiary: #666666;
		--accent: #ffffff;
		--accent-dim: #cccccc;
		--overlay-bg: #0e0e0e;
		--error-text: #ff9191;
		--success-text: #b2ffab;
	}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			background-color: var(--pure-black);
			color: var(--text-primary);
			min-height: 100dvh;
			position: relative;
			overflow: hidden;
		}

		body::before {
			content: '';
			position: absolute;
			inset: 0;
			background: radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.04), transparent 50%);
			z-index: -1;
		}

		.container {
			width: 100%;
			max-width: 420px;
			margin: auto;
			padding: 20px;
			height: 100dvh;
			display: flex;
			flex-direction: column;
		}

		.auth-container {
			display: flex;
			flex-direction: column;
			justify-content: center;
			position: relative;
			opacity: 0;
			animation: fadeInUp 0.8s ease 0.4s forwards;
			height: 100dvh;
		}

		.form-panel {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
			opacity 0.15s cubic-bezier(0.4, 0, 0.2, 1);
			pointer-events: none;
			justify-content: center;
			opacity: 0;
		}

		.form-panel.active {
			position: relative;
			pointer-events: auto;
			opacity: 1;
			transform: translateX(0);
			z-index: 2;
		}

		.form-panel.slide-out-left {
			transform: translateX(-30%);
			opacity: 0;
			z-index: 1;
		}

		.form-panel.slide-out-right {
			transform: translateX(30%);
			opacity: 0;
			z-index: 1;
		}

		.form-panel.slide-in-from-right {
			transform: translateX(30%);
			opacity: 0;
		}

		.form-panel.slide-in-from-left {
			transform: translateX(-30%);
			opacity: 0;
		}

		.auth-form {
			display: flex;
			flex-direction: column;
		}

		.content {
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 20px;
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
			scroll-behavior: smooth;
			height: auto;
			margin-bottom: 20px;
		}

		.content.scroll-active {
			justify-content: flex-start;
		}

		.footer {
			display: flex;
			flex-direction: column;
			gap: 13px;
			background: var(--pure-black);
			flex-shrink: 0;
			z-index: 3;
			position: relative;
			max-height: 100px;
		}

		#formTitle {
			font-size: 2.5rem;
			text-align: center;
			position: relative;
			margin-bottom: 5px;
			flex-shrink: 0;
			letter-spacing: -0.5px;
			font-weight: 600;
		}

		#formTitle::after {
			content: '';
			position: absolute;
			bottom: -10px;
			left: 50%;
			transform: translateX(-50%);
			width: 60px;
			height: 3px;
			background: var(--text-primary);
			border-radius: 3px;
		}

		.input-wrapper {
			position: relative;
			flex-shrink: 0;
		}

		.input-wrapper>i {
			position: absolute;
			left: 10px;
			top: 50%;
			width: 50px;
			height: 50px;
			max-width: 50px;
			display: flex;
			justify-content: center;
			align-items: center;
			border-radius: 15px;
			transform: translateY(-50%);
			font-size: 1.8rem;
			color: var(--text-secondary);
			z-index: 2;
			pointer-events: none;
			transition: color 0.2s;
			overflow: hidden;
		}

		.input-wrapper > i.bi.bi-lock-fill {
			transform: translateY(-50%) scaleX(1.3);
			transform-origin: center;
		}

		.input-wrapper input {
			width: 100%;
			height: 70px;
			padding: 14px 14px 14px 65px;
			background: var(--almost-black);
			border: 1px solid var(--border-subtle);
			border-radius: 20px;
			color: var(--text-primary);
			font-size: 1rem;
			outline: none;
			transition: border-color 0.2s, background-color 0.2s;
		}

		.input-wrapper input:focus {
			border-color: var(--text-primary);
			background: var(--dark-surface);
		}

		.input-wrapper input::placeholder {
			color: var(--text-tertiary);
		}

		#loginPassword,
		#regPassword {
			padding-right: 50px;
		}

		.toggle-password {
			position: absolute;
			height: 40px;
			width: 40px;
			right: 10px;
			top: 50%;
			transform: translateY(-50%);
			background: none;
			border: none;
			color: var(--text-secondary);
			font-size: 1.2rem;
			cursor: pointer;
			z-index: 2;
			padding: 8px;
			display: flex;
			align-items: center;
			justify-content: center;
			outline: none;
			transition: color 0.2s;
		}

		.toggle-password:hover {
			color: var(--text-primary);
		}

		.toggle-password:active {
			color: var(--accent-dim);
		}

		.submit-btn {
			height: 70px;
			background: var(--text-primary);
			border: none;
			border-radius: 25px;
			color: var(--pure-black);
			font-size: 1.2rem;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s, color 0.2s;
			flex-shrink: 0;
			letter-spacing: 0.3px;
		}

		.submit-btn:active {
			background: var(--accent-dim);
			color: var(--almost-black);
		}

		.form-actions-row {
			display: flex;
			justify-content: space-between;
			flex-wrap: nowrap;
			gap: 15px;
		}

		.action-link {
			background: none;
			border: none;
			color: var(--text-secondary);
			font-size: 0.95rem;
			cursor: pointer;
			text-align: center;
			width: 100%;
			max-width: 50%;
			transition: color 0.2s;
		}

		.action-link:hover {
			color: var(--text-primary);
		}

		.action-link.primary-action {
			color: var(--text-primary);
			font-weight: 500;
		}

		.action-link.primary-action:hover {
			color: var(--accent-dim);
		}

		.message {
			text-align: center;
			min-height: 24px;
			font-size: 1rem;
			flex-shrink: 0;
			font-weight: 400;
			letter-spacing: 0.2px;
		}

		.message.error {
			color: var(--error-text);
			font-style: italic;
		}

		.message.success {
			color: var(--success-text);
		}

		/* Кастомный чекбокс */
		.agreement-checkbox {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-top: 8px;
			text-wrap: wrap;
		}

		.agreement-checkbox input[type="checkbox"] {
			position: absolute;
			opacity: 0;
			width: 0;
			height: 0;
		}

		.agreement-checkbox .checkmark {
			flex-shrink: 0;
			width: 22px;
			height: 22px;
			background: var(--almost-black);
			border: 1px solid var(--border-subtle);
			border-radius: 6px;
			position: relative;
			cursor: pointer;
			transition: all 0.2s;
			margin-top: 0px;
		}

		.agreement-checkbox input:checked~.checkmark {
			background: var(--text-primary);
			border-color: var(--text-primary);
		}

		.agreement-checkbox .checkmark::after {
			content: '';
			position: absolute;
			display: none;
			left: 7px;
			top: 1px;
			width: 6px;
			height: 12px;
			border: solid var(--pure-black);
			border-width: 0 2px 2px 0;
			transform: rotate(45deg);
		}

		.agreement-checkbox input:checked~.checkmark::after {
			display: block;
		}

		.agreement-checkbox label {
			display: flex;
			align-items: flex-start;
			gap: 10px;
			color: var(--text-secondary);
			font-size: 0.8rem;
			line-height: 1.4;
			cursor: pointer;
			user-select: none;
		}

		.agreement-checkbox a {
			color: var(--text-primary);
			opacity: 0.8;
			text-decoration: underline;
			text-underline-offset: 2px;
		}

		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 768px) {
			.content {
				height: calc(100dvh - 140px);
				margin-bottom: 0;
			}
		}

		@media (max-width: 460px) {
			#formTitle {
				font-size: 2.1rem;
			}
		}

		.content::-webkit-scrollbar {
			width: 3px;
		}

		.content::-webkit-scrollbar-thumb {
			background: rgba(255, 255, 255, 0.15);
			border-radius: 10px;
		}

		.content::-webkit-scrollbar-track {
			background: transparent;
		}
	</style>
</head>
<body>
	<div class="container" id="mainContainer">
		<div class="auth-container" id="authContainer">

			<!-- Панель входа -->
			<div id="loginForm" class="form-panel active">
				<form class="auth-form" autocomplete="off" novalidate>
					<div class="content" id="loginContent">
						<h2 id="formTitle">Вход</h2>
						<div class="message" id="loginMessage"></div>

						<div class="input-wrapper">
							<i class="bi bi-envelope-fill"></i>
							<input type="text" id="loginIdentifier" placeholder="Введите email или логин" required>
						</div>
						<div class="input-wrapper">
							<i class="bi bi-lock-fill"></i>
							<input type="password" id="loginPassword" placeholder="Введите пароль" required>
							<button type="button" class="toggle-password" tabindex="-1"><i class="bi bi-eye-slash"></i></button>
						</div>
					</div>

					<div class="footer">
						<div class="form-actions-row">
							<button type="button" id="switchFormBtn" class="action-link primary-action">Регистрация</button>
							<button type="button" id="forgotPasswordBtn" class="action-link">Забыли пароль?</button>
						</div>
						<button type="submit" class="submit-btn">Войти</button>
					</div>
				</form>
			</div>

			<!-- Панель регистрации -->
			<div id="registerForm" class="form-panel">
				<form class="auth-form" autocomplete="off" novalidate>
					<div class="content" id="registerContent">
						<h2 id="formTitle">Регистрация</h2>
						<div class="message" id="registerMessage"></div>

						<div class="input-wrapper">
							<i class="bi bi-person-fill"></i>
							<input type="text" id="regLogin" placeholder="Придумайте логин" required>
						</div>
						<div class="input-wrapper">
							<i class="bi bi-envelope-fill"></i>
							<input type="email" id="regEmail" placeholder="Введите почту" required>
						</div>
						<div class="input-wrapper">
							<i class="bi bi-lock-fill"></i>
							<input type="password" id="regPassword" placeholder="Придумайте пароль" required>
							<button type="button" class="toggle-password" tabindex="-1"><i class="bi bi-eye-slash"></i></button>
						</div>

						<!-- Чекбокс согласия -->
						<div class="agreement-checkbox">
							<label for="registerAgreement">
								<input type="checkbox" id="registerAgreement" required>
								<span class="checkmark"></span>
								<span>Я ознакомился(-ась) с <a href="#" target="_blank">условиями использования</a> и <a href="#" target="_blank">политикой конфиденциальности</a></span>
							</label>
						</div>
					</div>

					<div class="footer">
						<div class="form-actions-row">
							<button type="button" id="switchFormBtnReg" class="action-link primary-action">Вход</button>
						</div>
						<button type="submit" class="submit-btn">Зарегистрироваться</button>
					</div>
				</form>
			</div>

		</div>
	</div>

	<script>
		(function() {
			const mainContainer = document.getElementById('mainContainer');
			const loginPanel = document.getElementById('loginForm');
			const registerPanel = document.getElementById('registerForm');
			const loginContent = document.getElementById('loginContent');
			const registerContent = document.getElementById('registerContent');

			const loginMessage = document.getElementById('loginMessage');
			const registerMessage = document.getElementById('registerMessage');

			const loginIdentifier = document.getElementById('loginIdentifier');
			const loginPassword = document.getElementById('loginPassword');
			const regLogin = document.getElementById('regLogin');
			const regEmail = document.getElementById('regEmail');
			const regPassword = document.getElementById('regPassword');
			const registerAgreement = document.getElementById('registerAgreement');

			const switchBtnLogin = document.getElementById('switchFormBtn');
			const switchBtnReg = document.getElementById('switchFormBtnReg');
			const forgotBtnLogin = document.getElementById('forgotPasswordBtn');

			let isLogin = true;
			let isAnimating = false;

			// Анимация переключения панелей
			function animatePanelSwitch(direction) {
				if (isAnimating) return;
				isAnimating = true;

				const currentPanel = isLogin ? loginPanel: registerPanel;
				const nextPanel = isLogin ? registerPanel: loginPanel;

				[loginPanel,
					registerPanel].forEach(p => {
						p.classList.remove('slide-out-left', 'slide-out-right',
							'slide-in-from-right', 'slide-in-from-left');
					});

				if (direction === 'forward') {
					currentPanel.classList.add('slide-out-left');
					nextPanel.classList.add('slide-in-from-right');
				} else {
					currentPanel.classList.add('slide-out-right');
					nextPanel.classList.add('slide-in-from-left');
				}

				nextPanel.classList.add('active');
				currentPanel.classList.remove('active');

				const onTransitionEnd = (e) => {
					if (e.target === nextPanel || e.target === currentPanel) {
						cleanup();
					}
				};
				const fallbackTimer = setTimeout(cleanup, 300);

				function cleanup() {
					if (!isAnimating) return;
					isAnimating = false;
					clearTimeout(fallbackTimer);

					[loginPanel,
						registerPanel].forEach(p => {
							p.classList.remove('slide-out-left', 'slide-out-right',
								'slide-in-from-right', 'slide-in-from-left');
						});

					if (isLogin) {
						loginPanel.classList.add('active');
						registerPanel.classList.remove('active');
					} else {
						registerPanel.classList.add('active');
						loginPanel.classList.remove('active');
					}

					nextPanel.removeEventListener('transitionend', onTransitionEnd);
					currentPanel.removeEventListener('transitionend', onTransitionEnd);
				}

				nextPanel.addEventListener('transitionend', onTransitionEnd, {
					once: true
				});
				currentPanel.addEventListener('transitionend', onTransitionEnd, {
					once: true
				});
			}

			function toggleForm(direction) {
				loginMessage.textContent = '';
				loginMessage.className = 'message';
				registerMessage.textContent = '';
				registerMessage.className = 'message';

				let savedId,
				savedPass,
				savedLogin,
				savedEmail;

				if (isLogin) {
					savedId = loginIdentifier.value;
					savedPass = loginPassword.value;
				} else {
					savedLogin = regLogin.value;
					savedEmail = regEmail.value;
					savedPass = regPassword.value;
				}

				isLogin = !isLogin;

				// Очистка полей неактивной формы и сброс чекбоксов
				if (isLogin) {
					regLogin.value = '';
					regEmail.value = '';
					regPassword.value = '';
					registerAgreement.checked = false;
				} else {
					loginIdentifier.value = '';
					loginPassword.value = '';
				}

				// Перенос данных согласно правилам
				if (isLogin) {
					if (savedEmail && savedLogin) {
						loginIdentifier.value = savedEmail;
					} else if (savedEmail) {
						loginIdentifier.value = savedEmail;
					} else if (savedLogin) {
						loginIdentifier.value = savedLogin;
					}
					loginPassword.value = savedPass || '';
				} else {
					const id = savedId || '';
					if (id.includes('@')) {
						regEmail.value = id;
						regLogin.value = '';
					} else {
						regLogin.value = id;
						regEmail.value = '';
					}
					regPassword.value = savedPass || '';
				}

				// Сброс состояния «показать пароль» в активной форме
				const activeForm = isLogin ? loginPanel: registerPanel;
				const toggleButtons = activeForm.querySelectorAll('.toggle-password');
				toggleButtons.forEach(btn => {
					const icon = btn.querySelector('i');
					if (icon) {
						icon.classList.remove('bi-eye');
						icon.classList.add('bi-eye-slash');
					}
					const input = btn.parentElement.querySelector('input');
					if (input && input.type === 'text') {
						input.type = 'password';
					}
				});

				animatePanelSwitch(direction);

				const activeContent = isLogin ? loginContent: registerContent;
				if (activeContent) {
					activeContent.scrollTop = 0;
				}
				document.querySelectorAll('.content').forEach(c => c.classList.remove('scroll-active'));
			}

			switchBtnLogin.addEventListener('click', () => toggleForm('forward'));
			switchBtnReg.addEventListener('click', () => toggleForm('back'));

			forgotBtnLogin.addEventListener('click', () => alert('Функция восстановления пароля в разработке.'));
			
			// Показать/скрыть пароль
			document.querySelectorAll('.toggle-password').forEach(button => {
				button.addEventListener('mousedown', (e) => {
					e.preventDefault();
				});

				button.addEventListener('click', (e) => {
					e.preventDefault();
					const wrapper = button.parentElement;
					const input = wrapper.querySelector('input');
					const icon = button.querySelector('i');
					if (!input || !icon) return;

					if (input.type === 'password') {
						input.type = 'text';
						icon.classList.remove('bi-eye-slash');
						icon.classList.add('bi-eye');
					} else {
						input.type = 'password';
						icon.classList.remove('bi-eye');
						icon.classList.add('bi-eye-slash');
					}
				});
			});

			// Отправка форм
			loginPanel.querySelector('form').addEventListener('submit', e => {
				e.preventDefault();
				const id = loginIdentifier.value.trim();
				const pw = loginPassword.value;

				if (!id || !pw) {
					loginMessage.textContent = 'Заполните все поля';
					loginMessage.className = 'message error';
					return;
				}

				loginMessage.textContent = 'Успешный вход!';
				loginMessage.className = 'message success';
			});

			registerPanel.querySelector('form').addEventListener('submit',
				e => {
					e.preventDefault();
					const login = regLogin.value.trim();
					const email = regEmail.value.trim();
					const pw = regPassword.value;

					if (!login || !email || !pw) {
						registerMessage.textContent = 'Заполните все поля';
						registerMessage.className = 'message error';
						return;
					}
					if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
						registerMessage.textContent = 'Введите корректный email';
						registerMessage.className = 'message error';
						return;
					}
					if (pw.length < 8) {
						registerMessage.textContent = 'Пароль должен быть минимум 8 символов';
						registerMessage.className = 'message error';
						return;
					}

					if (!registerAgreement.checked) {
						registerMessage.textContent = 'Необходимо согласие с условиями';
						registerMessage.className = 'message error';
						return;
					}

					registerMessage.textContent = 'Регистрация успешна!';
					registerMessage.className = 'message success';
					setTimeout(() => toggleForm('back'), 1600);
				});

			// Управление скроллом при открытии клавиатуры
			const allInputs = [loginIdentifier, loginPassword, regLogin, regEmail, regPassword];

			function getActiveContent() {
				return isLogin ? loginContent: registerContent;
			}

			function scrollToFocusedInput(input) {
				if (!input) return;
				const content = getActiveContent();
				if (!content) return;

				setTimeout(() => {
					const inputRect = input.getBoundingClientRect();
					const contentRect = content.getBoundingClientRect();
					const relativeTop = inputRect.top - contentRect.top + content.scrollTop;
					const targetScroll = relativeTop - contentRect.height / 2 + inputRect.height / 2;
					content.scrollTo({
						top: Math.max(0, targetScroll),
						behavior: 'smooth'
					});
				}, 150);
			}

			function updateScrollMode() {
				const content = getActiveContent();
				if (!content) return;
				const activeElement = document.activeElement;
				const isInputFocused = activeElement && allInputs.includes(activeElement);
				const vh = window.visualViewport ? window.visualViewport.height: window.innerHeight;
				const screenHeight = window.innerHeight;
				const keyboardOpen = vh < screenHeight * 0.85;

				if (isInputFocused && keyboardOpen) {
					content.classList.add('scroll-active');
				} else {
					content.classList.remove('scroll-active');
				}
			}

			allInputs.forEach(input => {
				input.addEventListener('focus', () => {
					updateScrollMode();
					scrollToFocusedInput(input);
				});
				input.addEventListener('input', () => {
					scrollToFocusedInput(input);
				});
				input.addEventListener('blur', () => {
					setTimeout(updateScrollMode, 100);
				});
			});

			function handleVisualViewport() {
				if (!window.visualViewport) return;

				function resizeHandler() {
					const vh = window.visualViewport.height;
					mainContainer.style.height = `${vh}px`;
					updateScrollMode();

					const activeElement = document.activeElement;
					if (activeElement && allInputs.includes(activeElement)) {
						scrollToFocusedInput(activeElement);
					}
				}

				window.visualViewport.addEventListener('resize', resizeHandler);
				window.visualViewport.addEventListener('scroll', resizeHandler);
				resizeHandler();
			}

			function init() {
				handleVisualViewport();
				loginPanel.classList.add('active');
				registerPanel.classList.remove('active');
			}

			init();
		})();
	</script>
</body>
</html>
